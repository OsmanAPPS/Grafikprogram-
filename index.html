<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grafik Çizim ve Analiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Grafik Çizim ve Analiz Aracı</h1>
    <div class="container">
        <div class="input-section">
            <h2>Veri Girişi</h2>
            <div id="dataset-container">
                <div class="dataset">
                    <h3>Veri Seti 1</h3>
                    <div class="data-points">
                        <div class="point">
                            <input type="number" class="x-input" placeholder="X Değeri">
                            <input type="number" class="y-input" placeholder="Y Değeri">
                            <button class="remove-point">X</button>
                        </div>
                    </div>
                    <button class="add-point">Nokta Ekle</button>
                </div>
            </div>
            <button id="add-dataset">Veri Seti Ekle</button>
            <button id="draw-chart">Grafiği Çiz</button>
        </div>
        <div class="chart-section">
            <canvas id="myChart"></canvas>
        </div>
        <div class="control-panel">
            <h2>Kontrol Paneli</h2>
            <div class="dataset-selector-container">
                <label for="dataset-selector">Analiz için Veri Seti Seçin:</label>
                <select id="dataset-selector"></select>
            </div>
            <button id="find-equation">Eğrinin Denklemini Bul</button>
            <button id="calculate-area">Altında Kalan Alanı Bul</button>
            <div class="analysis-grid">
                <button id="calc-mean-x">X Ortalaması</button>
                <button id="calc-mean-y">Y Ortalaması</button>
                <button id="calc-median-x">X Medyanı</button>
                <button id="calc-median-y">Y Medyanı</button>
                <button id="calc-stddev-x">X Std. Sapma</button>
                <button id="calc-stddev-y">Y Std. Sapma</button>
                <button id="calc-correlation">Korelasyon</button>
                <button id="calc-r-squared">R-Kare</button>
            </div>
            <div id="results"></div>
        </div>
    </div>

    <!-- 3D Plotting Section -->
    <div class="section-header">
        <h1>3D Denklem Çizim ve Analiz</h1>
    </div>
    <div class="container">
        <div class="input-section-3d">
            <h2>Denklem ve Ayarlar</h2>
            <input type="text" id="eq-input" placeholder="z = f(x, y) örn: sin(x) + cos(y)">
            <div class="range-inputs">
                <input type="number" id="x-min" placeholder="X Min" value="-10">
                <input type="number" id="x-max" placeholder="X Maks" value="10">
                <input type="number" id="y-min" placeholder="Y Min" value="-10">
                <input type="number" id="y-max" placeholder="Y Maks" value="10">
            </div>
            <button id="draw-3d-chart">3D Grafiği Çiz</button>
        </div>
        <div class="chart-section-3d">
            <div id="my3dChart"></div>
        </div>
        <div class="control-panel-3d">
            <h2>3D Analiz Paneli</h2>
            <div class="analysis-grid-3d">
                <button id="calc-max-z">Maksimum Değer</button>
                <button id="calc-min-z">Minimum Değer</button>
                <button id="calc-peak-coords">Tepe Koordinatları</button>
                <button id="calc-trough-coords">Çukur Koordinatları</button>
                <button id="calc-mean-z">Ortalama Yükseklik</button>
                <button id="calc-volume">Hacim (Yaklaşık)</button>
                <button id="calc-surface-area">Yüzey Alanı (Yaklaşık)</button>
                <button id="calc-height-diff">Toplam Yükseklik Farkı</button>
                <button id="calc-avg-slope">Ortalama Eğim</button>
                <button id="check-symmetry">Simetri Kontrolü</button>
            </div>
            <div id="results-3d"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.1/math.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
